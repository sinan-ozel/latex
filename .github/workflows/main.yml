name: Build LaTeX document
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    env:
      BASENAME: hello
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: pdflatex main
        uses: dante-ev/latex-action@latest
        env:
          TEXINPUTS: ".:/github/workspace/tex//:/github/workspace/classes//:"
        with:
          root_file: ${{ env.BASENAME }}.tex
          working_directory: tex
          compiler: pdflatex
          args: -interaction=nonstopmode -shell-escape

      - name: pdflatex main 2
        uses: dante-ev/latex-action@latest
        env:
          TEXINPUTS: ".:/github/workspace/tex//:/github/workspace/classes//:"
        with:
          root_file: ${{ env.BASENAME }}.tex
          working_directory: tex
          compiler: pdflatex
          args: -interaction=nonstopmode -shell-escape

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASENAME }}
          path: |
            tex/${{ env.BASENAME }}.pdf
            tex/${{ env.BASENAME }}.log

      - name: Tag release with PDF version
        run: |
          TAG_NAME="pdf-$(date +'%Y%m%d-%H%M')"
          git pull --rebase origin ${{ github.ref_name }}
          git tag $TAG_NAME
          git push origin $TAG_NAME

